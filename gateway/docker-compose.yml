# Production Docker Compose for LiteLLM Gateway.
# Deploy on a single VPS (Hetzner CX22 or similar).
# Cloudflare in front handles TLS — this stack only listens on 4000 internally.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres is internal only — no exposed ports.

  litellm:
    # Пин на иммутабельный digest (= LiteLLM 1.85.1, снят с main-stable 2026-06-14).
    # main-stable — подвижный тег: на нём v3 rate-limiter протекал внутренние поля
    # в тело запроса к Anthropic (см. CLAUDE.md «tpm/rpm-баг»). Фиксируем версию,
    # чтобы случайный re-pull не подменил её. Бамп: вернуть :main-stable, дёрнуть
    # `docker compose pull litellm`, проверить tpm/rpm-баг, снять новый digest.
    image: ghcr.io/berriai/litellm-database@sha256:fb757549de0da017a597ee4b9be0bfb55c49cde77898abe789fa3ad37d770c69
    container_name: gateway_litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Listen on localhost only; Cloudflare Tunnel or reverse proxy connects.
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    healthcheck:
      # LiteLLM image does not ship with curl/wget; use Python (always present).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).getcode()==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
