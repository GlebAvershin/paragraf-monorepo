# LiteLLM Proxy configuration
# Provides unified API for Claude, GPT, GigaChat with virtual keys, budgets, spend tracking.
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ---------- Anthropic ----------
  # Anthropic models. Full ID (matches opencode's models.dev catalog) +
  # short alias (kept for backwards compat with existing virtual_keys).
  # Newest Sonnet 4.6 ships May 2026; we keep 4.5 as an alias-only line.

  # Sonnet — latest is 4.6
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: { mode: chat }
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: { mode: chat }
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: { mode: chat }

  # Opus — latest is 4.7
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: { mode: chat }
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: { mode: chat }

  # Haiku — latest is 4.5
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: { mode: chat }
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: { mode: chat }

  # ---------- OpenAI ----------
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat

  # ---------- GigaChat (Sber) ----------
  # Sber uses self-signed SSL cert → ssl_verify: false (per LiteLLM docs).
  # GIGACHAT_CREDENTIALS = base64(client_id:client_secret) from
  # https://developers.sber.ru/studio
  #
  # Pricing (Sber 2026, GIGACHAT_API_PERS scope):
  #   GigaChat  (Lite)  — 0.2 ₽ / 1K input + 0.4 ₽ / 1K output
  #   GigaChat-Pro      — 1.5 ₽ / 1K both directions
  #   GigaChat-Max      — 1.95 ₽ / 1K both directions
  # Converted to USD at 1₽=$0.0111 (90 ₽/$), kept as cost-per-token (per-token, not per-1K).
  # Adjust when RUB/USD shifts materially. Used for spend tracking + budget enforcement.
  # additional_drop_params: opencode sends tools/response_format/tool_choice
  # which Sber's GigaChat schema-validates more strictly than OpenAI. Strip
  # them at LiteLLM before the upstream call. Trade-off: agent cannot invoke
  # our doc-tools tools when using GigaChat — chat-only.
  - model_name: gigachat-pro
    litellm_params:
      model: gigachat/GigaChat-Pro
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false
      additional_drop_params: ["tools", "tool_choice", "response_format", "parallel_tool_calls"]
    model_info:
      mode: chat
      input_cost_per_token: 0.0000167
      output_cost_per_token: 0.0000167

  - model_name: gigachat-max
    litellm_params:
      model: gigachat/GigaChat-Max
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false
      additional_drop_params: ["tools", "tool_choice", "response_format", "parallel_tool_calls"]
    model_info:
      mode: chat
      input_cost_per_token: 0.0000217
      output_cost_per_token: 0.0000217

  - model_name: gigachat-lite
    litellm_params:
      model: gigachat/GigaChat
      api_key: os.environ/GIGACHAT_CREDENTIALS
      ssl_verify: false
      additional_drop_params: ["tools", "tool_choice", "response_format", "parallel_tool_calls"]
    model_info:
      mode: chat
      input_cost_per_token: 0.0000022
      output_cost_per_token: 0.0000044

  # ---------- YandexGPT (Yandex Cloud Foundation Models) ----------
  # LiteLLM has no native Yandex provider — use the OpenAI-compatible mode
  # exposed by Yandex Cloud (https://llm.api.cloud.yandex.net/v1).
  # Model URI format: gpt://<folder_id>/<model>/latest
  # YANDEX_API_KEY — API key of a service account with ai.languageModels.user role.
  # YANDEX_FOLDER_ID — folder id from console.yandex.cloud (vXXXX...).
  # Same `additional_drop_params` strategy as GigaChat: Yandex Cloud's
  # OpenAI-compat layer does not support tools/response_format the way
  # OpenAI proper does; strip these to keep chat-completions calls clean.
  # Алиас yandexgpt-pro (а не просто yandexgpt) — чтобы в пикере отображалось
  # «YandexGPT Pro» в один ряд с gigachat-pro/yandexgpt-lite. Сам URI модели у
  # Яндекса остаётся yandexgpt/latest (это и есть Pro).
  - model_name: yandexgpt-pro
    litellm_params:
      model: openai/gpt://os.environ/YANDEX_FOLDER_ID/yandexgpt/latest
      api_base: https://llm.api.cloud.yandex.net/v1
      api_key: os.environ/YANDEX_API_KEY
      additional_drop_params: ["tools", "tool_choice", "response_format", "parallel_tool_calls"]
    model_info: { mode: chat }

  - model_name: yandexgpt-lite
    litellm_params:
      model: openai/gpt://os.environ/YANDEX_FOLDER_ID/yandexgpt-lite/latest
      api_base: https://llm.api.cloud.yandex.net/v1
      api_key: os.environ/YANDEX_API_KEY
      additional_drop_params: ["tools", "tool_choice", "response_format", "parallel_tool_calls"]
    model_info: { mode: chat }

# ---------- Global settings ----------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Persist virtual keys and spend in Postgres (not in-memory).
  store_model_in_db: true
  # Allow only configured models — block requests for unknown model names.
  default_team_settings: []

litellm_settings:
  # Drop unsupported params silently instead of erroring (better UX for client SDKs).
  drop_params: true
  # Structured JSON logs for production observability.
  json_logs: true
  set_verbose: false
  # Prompt caching where supported (Anthropic, OpenAI).
  cache: true
  cache_params:
    type: local  # in-memory; switch to redis later if multi-instance.

  # Failure retries.
  num_retries: 2
  request_timeout: 600

  # Fallbacks: if Anthropic is down, try OpenAI silently.
  # The client gets a response, just possibly from a different model.
  fallbacks:
    - claude-sonnet: ["gpt-4o"]
    - claude-opus: ["gpt-4o"]

# ---------- Router settings ----------
router_settings:
  # Round-robin if multiple instances of same model registered.
  routing_strategy: simple-shuffle
  redis_host: null  # not used until we add Redis
