# Production Docker Compose for LiteLLM Gateway (ТЗ-06).
#
# Деплоится на зарубежном VPS (Hetzner CX22 / KZ / AM).
# Caddy завершает TLS на 80/443, проксирует в LiteLLM на :4000.
# Postgres — внутренний, без публичных портов.
#
# Запуск:
#   cp .env.prod.example .env.prod
#   # заполнить .env.prod (LITELLM_MASTER_KEY, ANTHROPIC_API_KEY, ...)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Бэкап и деплой — см. scripts/backup.sh и scripts/deploy.sh.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Без публичных портов — только внутри docker network.

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: gateway_litellm_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # БЕЗ публичных ports — Caddy ходит по docker network.
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      STORE_MODEL_IN_DB: "True"
      # LiteLLM spend-алерты в Slack (опционально)
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).getcode()==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: gateway_caddy
    restart: unless-stopped
    depends_on:
      - litellm
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN}
      GATEWAY_DOMAIN_FALLBACK: ${GATEWAY_DOMAIN_FALLBACK:-}
      ACME_EMAIL: ${ACME_EMAIL}

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
