[project]
name = "gost-rag"
version = "0.1.0"
description = "ГОСТ Q&A agent — prototype to benchmark RAG vs RLM and compare models via OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pdfplumber>=0.11",
]

# Optional, heavier eval deps. Install with: uv sync --extra eval
[project.optional-dependencies]
eval = ["ragas>=0.2", "pandas>=2.2"]
trace = ["langfuse>=2"]
dev = ["pytest>=8"]
# HTTP service so the product (engine) can ground answers in ГОСТ. Install: uv sync --extra serve
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gost_rag"]

[tool.uv]
package = true
