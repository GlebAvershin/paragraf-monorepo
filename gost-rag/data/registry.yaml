# Реестр метаданных ГОСТов для ингеста реальных PDF (см. ingest/pdf.py).
# Ключ — gost_id РОВНО как печатается на титуле: "ГОСТ Р 7.0.97-2016".
# industry из текста надёжно не вывести → задаём здесь. title/year — опциональный
# override (иначе подхватятся: title — с титульной страницы, year — из суффикса -ГГГГ).
#
# Формат:
#   "ГОСТ <...>":
#     industry: <отрасль>          # обязательно (фильтр в Qdrant)
#     title: "<полное название>"   # опц.
#     year: <ГГГГ>                 # опц.

"ГОСТ Р 7.0.97-2016":
  industry: делопроизводство
  title: "СИБИД. Организационно-распорядительная документация. Требования к оформлению документов"
  year: 2016

"ГОСТ 2.105-2019":
  industry: конструкторская документация
  title: "ЕСКД. Общие требования к текстовым документам"
  year: 2019
