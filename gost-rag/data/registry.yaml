# Реестр корпуса ГОСТ/СП/СанПиН/ТР ТС для ингеста реальных PDF (см. ingest/pdf.py).
#
# Ключ — slug ФАЙЛА в data/pdfs/ (без .pdf). Это канонический источник истины: детект
# маркировки по тексту хрупок (em-dash в годе, обрезка префикса «СП 295.», сканы без текста),
# поэтому gost_id берём отсюда. gost_id печатается РОВНО как в gold.yaml и в data.md.
#
# Формат:
#   <slug>:
#     gost_id:  "<маркировка как в gold>"   # обязательно
#     industry: <отрасль>                   # обязательно (метаданные/фильтр Qdrant; фильтр по умолчанию off)
#     title:    "<краткое название>"        # опц.
#     year:     <ГГГГ>                       # опц.
#
# Домен — «арматура» (двойной смысл: арматурный прокат ЖБК + трубопроводная/санитарная арматура).
# industry-бакеты нужны для будущих экспериментов с фильтрацией; ретрив по умолчанию идёт без фильтра,
# т.к. ответ на вопрос часто опирается на документы из разных бакетов.

