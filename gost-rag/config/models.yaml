# Candidate models for the benchmark matrix.
# `id` = gateway alias (litellm-config.yaml). These mirror OpenRouter ids, so they also work when
# pointing gost-rag directly at OpenRouter. Add a model here AND in the gateway config to compare it.
# `price` is USD per 1M tokens (in/out); leave null if unknown — cost is then reported as null.
generation:
  - id: qwen/qwen3-8b
    label: qwen3-8b
    price: { in: null, out: null }
  - id: deepseek/deepseek-chat
    label: deepseek-v3
    price: { in: null, out: null }
  - id: z-ai/glm-5.2
    label: glm-5.2
    price: { in: null, out: null }
  - id: z-ai/glm-4.6
    label: glm-4.6
    price: { in: 0.43, out: 1.74 }   # USD/1M (openrouter.ai/z-ai/glm-4.6)
  - id: anthropic/claude-3.7-sonnet
    label: claude-sonnet
    price: { in: null, out: null }
  # GigaChat — только через шлюз (РФ-модель, не на OpenRouter). Нужен GIGACHAT_CREDENTIALS в .env шлюза.
  # - id: gigachat-pro
  #   label: gigachat-pro
  #   price: { in: 16.7, out: 16.7 }     # ₽-прайс уже учтён в gateway model_info; тут — для cost-колонки
  # - id: gigachat-lite
  #   label: gigachat-lite
  #   price: { in: 2.2, out: 4.4 }

# Model used as the LLM-judge for faithfulness (keep cheap + capable in Russian).
judge:
  id: qwen/qwen3-8b

# Strategies / ablations swept by the eval harness. Multi-agent variants (Stream C) sit behind
# the same interface, so each becomes a benchmark row compared on the trust×cost axes.
strategies:
  - name: rag
    top_k: 8
    rerank: false
  - name: rag
    top_k: 8
    rerank: true
  # D1 — hybrid dense+BM25 retrieval. Needs the *_hybrid collection: `index_corpus.py --hybrid`.
  - name: rag
    top_k: 8
    hybrid: true
  # D2 — native cross-encoder reranker (RERANK_* endpoint) instead of the in-house LLM ranker.
  - name: rag
    top_k: 8
    rerank: native
  - name: rlm
    max_steps: 12
    max_depth: 2
  # C1 — verifier panel; consensus="unanimous" biases hard toward precision (abstain on any reject).
  - name: verify_ensemble
    top_k: 8
    consensus: unanimous
  # C2 — planner → per-subquestion RAG → aggregator.
  - name: decompose
    top_k: 6
    max_subq: 4
  # C3 — K sampled candidates → majority citation-signature (>= min_agreement must agree, else abstain).
  - name: self_consistency
    top_k: 8
    k_candidates: 3
    temperature: 0.7
    min_agreement: 2
  # C4 — same context through M models → reconcile by agreement (ignores the swept gen_model).
  - name: model_ensemble
    top_k: 8
    min_agreement: 2
    models: [qwen/qwen3-8b, deepseek/deepseek-chat]
