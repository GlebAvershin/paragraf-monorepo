# Gold question set — REAL corpus (домен «арматура»: арматурный прокат ЖБК + трубопроводная/
# санитарная арматура). Источник разметки: размеченные пользователем сценарии (data.md).
#
# Гранулярность разметки — УРОВЕНЬ ДОКУМЕНТА: какие авторитетные стандарты нужно открыть.
# Поэтому `expected` перечисляет gost_id БЕЗ clause_path → recall считается на уровне документа
# (любой пункт нужного документа в контексте ⇒ документ покрыт; см. evalmetrics.recall_fraction).
# Точность ссылок на конкретный пункт меряется отдельно — детерминированным валидатором цитат
# против корпуса (validate.py / corpus_citation_diagnostics), не по gold.
#
# Поля:
#   id            — стабильный хэндл
#   query         — вопрос (как задаёт инженер)
#   expected      — список {gost_id} нужных документов (для негативов — пусто)
#   materials     — ожидаемые классы/типы материала (проверка существа ответа; опц.)
#   reference     — эталонный ответ (LLM-судья / ручная проверка; reference для RAGAS)
#   industry      — бакет (стратификация; ретрив по умолчанию НЕ фильтрует)
#   expects_answer— false ⇒ ответа нет в корпусе, система ДОЛЖНА воздержаться
#   difficulty    — easy | medium | hard
#   type          — recommendation | citation | multihop | negative
#
# NB: СанПиН 1.2.3685-21 — известный scan-gap (нет текстового PDF, в индекс не попал), но остаётся
# ожидаемым документом в q-child/q-potable: harness покажет его как retrieval-miss честно.

