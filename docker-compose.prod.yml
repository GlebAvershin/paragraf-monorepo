# Prod stack — весь монорепо (web-статика + engine + billing) на ОДНОМ сервере
# (Yandex Cloud). Gateway (paragraf-gateway: litellm + gateway-app) — отдельный
# git-репозиторий, деплоится СВОИМ docker-compose.prod.yml в соседний каталог на
# ТОМ ЖЕ сервере. Связь — через общую внешнюю docker-сеть `isaak_shared` (НЕ
# host.docker.internal — на Linux порт, опубликованный как 127.0.0.1:PORT на
# хосте, недоступен из контейнера через host-gateway route: соединение идёт с
# IP docker-бриджа, не с 127.0.0.1, и хост его отклоняет — поймано на первом
# реальном деплое). Публичного входа для gateway всё равно не нужно.
#
# Redis не используется — идемпотентность/OTP-лок уже на Postgres (см. auth.ts,
# webhooks.ts). Раньше был в спеке как заготовка, в коде не используется.
#
# Запуск:
#   docker network create isaak_shared   # один раз, до первого up (или см. deploy.sh)
#   cp .env.prod.example .env.prod && заполнить
#   ./scripts/build-static.sh          # web/packages/app → dist/ (нужен для Caddy)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   ./scripts/migrate-prod.sh          # применить billing-миграции + health-check

networks:
  isaak_shared:
    external: true

services:
  postgres_billing:
    image: postgres:16-alpine
    container_name: isaak_postgres_billing
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${BILLING_POSTGRES_PASSWORD}
    volumes:
      - billing_pg_data:/var/lib/postgresql/data
      - ./backups/billing:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Без публичных портов — только внутренняя docker-сеть.

  postgres_engine:
    image: postgres:16-alpine
    container_name: isaak_postgres_engine
    restart: unless-stopped
    environment:
      POSTGRES_DB: engine
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: ${ENGINE_POSTGRES_PASSWORD}
    volumes:
      - engine_pg_data:/var/lib/postgresql/data
      - ./backups/engine:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing:
    build:
      context: ./billing
      dockerfile: Dockerfile
    image: isaak/billing:latest
    container_name: isaak_billing
    restart: unless-stopped
    depends_on:
      postgres_billing:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://billing:${BILLING_POSTGRES_PASSWORD}@postgres_billing:5432/billing
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-billing.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ourapp-desktop}
      # Gateway (paragraf-gateway) — на этом же сервере, отдельный compose-стек,
      # достаём по имени контейнера через общую сеть isaak_shared (см. шапку файла).
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET}
      CLOUDPAYMENTS_WEBHOOK_SECRET: ${CLOUDPAYMENTS_WEBHOOK_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [default, isaak_shared]

  billing_etl_worker:
    image: isaak/billing:latest
    container_name: isaak_billing_etl
    restart: unless-stopped
    depends_on:
      billing:
        condition: service_started
    command: ["bun", "run", "dist/worker/etl.js", "--loop", "--interval=30"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://billing:${BILLING_POSTGRES_PASSWORD}@postgres_billing:5432/billing
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [default, isaak_shared]

  billing_retry_worker:
    image: isaak/billing:latest
    container_name: isaak_billing_retry
    restart: unless-stopped
    depends_on:
      billing:
        condition: service_started
    command: ["bun", "run", "dist/worker/recurrent-retry.js", "--loop", "--interval=3600"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://billing:${BILLING_POSTGRES_PASSWORD}@postgres_billing:5432/billing
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [default, isaak_shared]

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    image: isaak/engine:latest
    container_name: isaak_engine
    restart: unless-stopped
    depends_on:
      postgres_engine:
        condition: service_healthy
    expose:
      - "4096"
    environment:
      PORT: "4096"
      DATABASE_URL: postgresql://engine:${ENGINE_POSTGRES_PASSWORD}@postgres_engine:5432/engine
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-billing.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ourapp-desktop}
      ANSWER_URL: ${ANSWER_URL:-http://gateway-app:4100}
      GATEWAY_API_SECRET: ${GATEWAY_API_SECRET}
      BILLING_URL: http://billing:3000
      WEB_PUBLIC_URL: ${APP_PUBLIC_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [default, isaak_shared]

  caddy:
    image: caddy:2-alpine
    container_name: isaak_caddy
    restart: unless-stopped
    depends_on:
      - billing
      - engine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/packages/app/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

volumes:
  billing_pg_data:
    driver: local
  engine_pg_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
