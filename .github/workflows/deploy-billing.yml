# Deploy billing prod на push в ветку prod (ТЗ-06 §6).
#
# Schema: SSH на РФ-VPS → git pull → docker build → up -d → migrate → health.
# Откат при failure: см. docs/DEPLOY.md.
#
# Секреты:
#   BILLING_DEPLOY_HOST   — IP или DNS VPS
#   BILLING_DEPLOY_USER   — пользователь (deploy)
#   BILLING_DEPLOY_KEY    — приватный SSH-ключ (PEM)

name: Deploy Billing

on:
  push:
    branches: [prod]
    paths:
      - "billing/**"
      - ".github/workflows/deploy-billing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-billing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production-billing
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.BILLING_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.BILLING_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.BILLING_DEPLOY_HOST }}
          USER: ${{ secrets.BILLING_DEPLOY_USER }}
        run: |
          ssh "$USER@$HOST" "cd /opt/billing && ./scripts/deploy.sh"

      - name: Smoke test (health endpoint)
        run: |
          DOMAIN="${{ secrets.BILLING_DOMAIN }}"
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 10 "https://$DOMAIN/health/readiness" | grep -q '"ok"'; then
              echo "billing prod healthy"
              exit 0
            fi
            echo "attempt $i failed, retry in 5s..."
            sleep 5
          done
          echo "::error::billing prod NOT healthy after 5 attempts"
          exit 1
