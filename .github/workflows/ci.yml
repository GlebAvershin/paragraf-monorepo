# CI — typecheck + tests на каждом push/PR. Гейт для деплоя (см. deploy.yml — job
# `deploy` requires `needs: [billing, engine, doc-tools, web-app]`, деплой не
# стартует, пока все зелёные).
#
# Пути актуализированы под структуру после слияния glar → web/ (2026-06-26):
# было desktop/packages/{app,doc-tools} — стало web/packages/app и doc-tools/
# (отдельный пакет в корне). PII-тесты (app/src/ourapp/pii/pii.test.ts) удалены
# при развороте архитектуры (маскирование ушло в gateway) — здесь их больше нет.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  billing:
    name: billing — typecheck + tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U billing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: billing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Apply schema + seed (fresh CI DB)
        env:
          DATABASE_URL: postgres://billing:billing@localhost:5433/billing
          JWT_SECRET: test-secret-${{ github.run_id }}-padding-to-32-chars-min
          LITELLM_BASE_URL: http://localhost:4000
          LITELLM_MASTER_KEY: sk-test-master
        run: |
          bun run db:push
          bun run db:seed
      - name: Tests
        env:
          DATABASE_URL: postgres://billing:billing@localhost:5433/billing
          JWT_SECRET: test-secret-${{ github.run_id }}-padding-to-32-chars-min
          LITELLM_BASE_URL: http://localhost:4000
          LITELLM_MASTER_KEY: sk-test-master
          # config.ts парсит process.env ОДИН РАЗ при первом импорте (module-
          # singleton) — раньше эти значения выставлялись только внутри
          # payments-flow.test.ts/e2e-golden.test.ts до импорта config, но это
          # зависит от порядка загрузки тестовых файлов bun test. Появление
          # compute-credits.test.ts (тир embedding) сдвинуло порядок и все 5
          # payments-тестов стали получать 503 вместо реальных кодов — тесты
          # НЕ флейки, а настоящая регрессия из-за фрагильного паттерна.
          # Задаём здесь — гарантированно ДО любого импорта, независимо от
          # порядка файлов.
          CLOUDPAYMENTS_PUBLIC_ID: test_pub
          CLOUDPAYMENTS_API_SECRET: test_secret
          CLOUDPAYMENTS_WEBHOOK_SECRET: test_webhook_secret
          CLOUDPAYMENTS_API_URL: http://localhost:9998
        run: bun test

  engine:
    name: engine — typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # NB: engine не имеет юнит-тестов (тонкий store+forward слой, покрыт
      # e2e-проверками вручную). Добавить `bun test`, когда появится сьют.

  doc-tools:
    name: doc-tools — typecheck + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: doc-tools
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test

  web-app:
    name: web/app — typecheck + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd packages/app typecheck
      - name: Tests
        run: bun run --cwd packages/app test:unit
