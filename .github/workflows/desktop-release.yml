# Desktop release — сборка и подпись инсталляторов на тег v* (ТЗ-06 §6).
#
# КРИТИЧНО: production NSIS сборка из RU-сети флакает (см. CLAUDE.md). Поэтому
# инсталляторы собираются ТОЛЬКО на CI (GitHub Actions).
#
# Подпись:
#   - Windows: rfc3161 timestamp + EV cert (gated на наличие WINDOWS_CERT secret)
#   - macOS: notarization (gated на APPLE_ID и APPLE_APP_PASSWORD)
# Если секреты не настроены — сборка идёт без подписи (можно для пилота).

name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck || echo "::warning::typecheck failed but continuing"

      - name: Build
        working-directory: desktop/packages/desktop
        run: bun run build

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: desktop/packages/desktop
        env:
          # Опциональная подпись Windows. Если нет секрета — собираем без подписи.
          CSC_LINK: ${{ secrets.WINDOWS_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: bunx electron-builder --win --config electron-builder.config.ts

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: desktop/packages/desktop
        env:
          # Notarization — только если все секреты заданы.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: bunx electron-builder --mac --config electron-builder.config.ts

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop/packages/desktop
        run: bunx electron-builder --linux --config electron-builder.config.ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paragraf-${{ matrix.os }}
          path: |
            desktop/packages/desktop/dist/*.exe
            desktop/packages/desktop/dist/*.dmg
            desktop/packages/desktop/dist/*.AppImage
            desktop/packages/desktop/dist/*.deb
            desktop/packages/desktop/dist/*.tar.gz
            desktop/packages/desktop/dist/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: true
