# Production Docker Compose для billing-сервиса (ТЗ-06).
#
# Деплоится на РФ-VPS (Selectel/Yandex Cloud) — ПДн пользователей не должны
# покидать РФ (152-ФЗ).
#
# Слои: Caddy (TLS) → billing (Hono) ↔ Postgres (ПДн!) ↔ Redis (idempotency).
# recurrent-retry — отдельный контейнер с тем же образом, запущенный как воркер.
#
# Запуск:
#   cp .env.prod.example .env.prod
#   # заполнить .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   ./scripts/migrate-prod.sh   # применить миграции

services:
  postgres:
    image: postgres:16-alpine
    container_name: billing_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Без публичных портов — внутренний.

  redis:
    image: redis:7-alpine
    container_name: billing_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  billing:
    build:
      context: .
      dockerfile: Dockerfile
    image: ourapp/billing:latest
    container_name: billing_app_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://billing:${POSTGRES_PASSWORD}@postgres:5432/billing
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET}
      CLOUDPAYMENTS_WEBHOOK_SECRET: ${CLOUDPAYMENTS_WEBHOOK_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # Воркер ретраев CloudPayments — отдельный процесс с тем же образом.
  retry-worker:
    image: ourapp/billing:latest
    container_name: billing_retry_worker
    restart: unless-stopped
    depends_on:
      billing:
        condition: service_started
    command: ["bun", "run", "dist/worker/recurrent-retry.js", "--loop", "--interval=3600"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://billing:${POSTGRES_PASSWORD}@postgres:5432/billing
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # ETL воркер: тянет spend logs из LiteLLM, списывает кредиты.
  etl-worker:
    image: ourapp/billing:latest
    container_name: billing_etl_worker
    restart: unless-stopped
    depends_on:
      billing:
        condition: service_started
    command: ["bun", "run", "dist/worker/etl.js", "--loop", "--interval=30"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://billing:${POSTGRES_PASSWORD}@postgres:5432/billing
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  caddy:
    image: caddy:2-alpine
    container_name: billing_caddy
    restart: unless-stopped
    depends_on:
      - billing
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      BILLING_DOMAIN: ${BILLING_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
