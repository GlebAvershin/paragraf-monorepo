<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1px solid var(--hairline-strong);border-radius:12px;background:var(--surface);overflow:hidden;">
  <button onClick="{{ toggle }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;background:transparent;border:none;cursor:pointer;padding:17px 20px;font-family:var(--body);" style-hover="{{ hover }}">
    <span style="font-size:15px;font-weight:500;color:var(--text-primary);">{{ q }}</span>
    <span style="flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--accent);transition:transform .2s ease;transform:{{ rot }};">+</span>
  </button>
  <sc-if value="{{ open }}">
    <div style="padding:0 20px 18px;font-size:14px;line-height:1.6;color:var(--text-secondary);animation:fadeUp .2s ease-out both;">{{ a }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:80},&quot;q&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;С чего начать?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;a&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;На главной нажмите «Начать новую задачу». Откроется список сценариев под вашу профессию.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: null };
  renderVals() {
    const open = this.state.open === null ? !!this.props.open : this.state.open;
    return {
      open,
      rot: open ? 'rotate(45deg)' : 'rotate(0deg)',
      hover: { background: 'var(--surface-alt)' },
      toggle: () => this.setState(st => ({ open: !(st.open === null ? !!this.props.open : st.open) })),
    };
  }
}
</script>
</body>
</html>
